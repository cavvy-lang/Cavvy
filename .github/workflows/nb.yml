name: Cavvy Nightly Build

on:
  schedule:
    # 每天 UTC 02:00 运行（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip cargo test (for emergency build)'
        required: false
        default: 'false'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-A warnings"

permissions:
  contents: read

jobs:
  version:
    name: Read .verinfo
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.verinfo.outputs.tag }}
      version: ${{ steps.verinfo.outputs.version }}
      build: ${{ steps.verinfo.outputs.build }}
      date: ${{ steps.verinfo.outputs.date }}
      basename: ${{ steps.verinfo.outputs.basename }}
      short_sha: ${{ steps.verinfo.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse .verinfo
        id: verinfo
        shell: bash
        run: python scripts/verinfo.py --github-output

  build-windows:
    name: Windows build & test
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-gnu

      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: llvm-minimal
          key: llvm-${{ runner.os }}-${{ hashFiles('.verinfo', 'setup-llvm.py') }}

      - name: Setup LLVM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:CAVVY_USE_FULL_LLVM = "1"
          python setup-llvm.py
          if ($LASTEXITCODE -ne 0) {
            Write-Error "setup-llvm.py failed with exit code $LASTEXITCODE"
            exit 1
          }
          $llvmPath = Join-Path $pwd "llvm-minimal"
          "LLVM_SYS_221_PREFIX=$llvmPath" >> $env:GITHUB_ENV
          "$llvmPath\bin" >> $env:GITHUB_PATH
          Write-Host "LLVM installed at: $llvmPath"
          & "$llvmPath\bin\llvm-config.exe" --version

      - name: Run cargo test
        if: github.event.inputs.skip_tests != 'true'
        shell: pwsh
        run: |
          $env:LLVM_SYS_221_PREFIX = Join-Path $pwd "llvm-minimal"
          cargo test --release --verbose

      - name: Build release
        shell: pwsh
        run: |
          $env:LLVM_SYS_221_PREFIX = Join-Path $pwd "llvm-minimal"
          cargo build --release --verbose

      - name: Package artifacts
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $baseName = "${{ needs.version.outputs.basename }}"
          $buildDir = "target/release"

          if (-not (Test-Path "$buildDir/cayc.exe")) {
            Write-Error "Release build not found"
            exit 1
          }

          Remove-Item -Recurse -Force packaging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "packaging/full/caylibs" | Out-Null
          New-Item -ItemType Directory -Force -Path "packaging/core" | Out-Null
          New-Item -ItemType Directory -Force -Path "packaging/core/caylibs" | Out-Null

          Copy-Item -Path "caylibs/*" -Destination "packaging/full/caylibs/" -Recurse -Force
          Copy-Item -Path "caylibs/*" -Destination "packaging/core/caylibs/" -Recurse -Force

          if (Test-Path "lib") {
            New-Item -ItemType Directory -Force -Path "packaging/full/lib" | Out-Null
            Copy-Item -Path "lib/*" -Destination "packaging/full/lib/" -Recurse -Force
          }
          if (Test-Path "mingw-minimal") {
            New-Item -ItemType Directory -Force -Path "packaging/full/mingw-minimal" | Out-Null
            Copy-Item -Path "mingw-minimal/*" -Destination "packaging/full/mingw-minimal/" -Recurse -Force
          }
          if (Test-Path "llvm-minimal") {
            New-Item -ItemType Directory -Force -Path "packaging/full/llvm-minimal" | Out-Null
            Copy-Item -Path "llvm-minimal/*" -Destination "packaging/full/llvm-minimal/" -Recurse -Force
          }
          if (Test-Path "third-party") {
            New-Item -ItemType Directory -Force -Path "packaging/full/third-party" | Out-Null
            Copy-Item -Path "third-party/*" -Destination "packaging/full/third-party/" -Recurse -Force
          }
          if (Test-Path "examples") {
            New-Item -ItemType Directory -Force -Path "packaging/full/examples" | Out-Null
            Copy-Item -Path "examples/*" -Destination "packaging/full/examples/" -Recurse -Force
          }

          Copy-Item -Path "$buildDir/*.exe" -Destination "packaging/full/" -Force
          Copy-Item -Path "$buildDir/*.exe" -Destination "packaging/core/" -Force

          $fullName = "${baseName}-win-x86_64-mingw64-llvm22.zip"
          $coreName = "${baseName}-win-x86_64-core.zip"
          Compress-Archive -Path "packaging/full/*" -DestinationPath $fullName -Force
          Compress-Archive -Path "packaging/core/*" -DestinationPath $coreName -Force

          Write-Host "Created: $fullName"
          Write-Host "Created: $coreName"
          "FULL_ARCHIVE=$fullName" >> $env:GITHUB_OUTPUT
          "CORE_ARCHIVE=$coreName" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cavvy-nightly-windows
          path: |
            ${{ steps.package.outputs.FULL_ARCHIVE }}
            ${{ steps.package.outputs.CORE_ARCHIVE }}
          if-no-files-found: error

  build-linux:
    name: Linux build & test
    needs: version
    # 官方 LLVM 22.1.6 Linux 包面向 Ubuntu 22.04，固定 runner 以避免
    # 24.04 的 libxml2 soname 变化导致 ld.lld 启动失败。
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache LLVM
        uses: actions/cache@v4
        with:
          path: llvm-minimal
          key: llvm-${{ runner.os }}-${{ hashFiles('.verinfo', 'setup-llvm.py') }}

      - name: Install LLVM runtime dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2 libzstd1 zlib1g libedit2 libffi8 libtinfo6 libxml2-dev libzstd-dev zlib1g-dev libedit-dev libffi-dev

      - name: Setup LLVM
        shell: bash
        run: |
          set -euo pipefail
          export CAVVY_USE_FULL_LLVM=1
          python setup-llvm.py
          echo "LLVM_SYS_221_PREFIX=$PWD/llvm-minimal" >> "$GITHUB_ENV"
          echo "$PWD/llvm-minimal/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$PWD/llvm-minimal/lib:$PWD/target/release/llvm-minimal/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          test -d llvm-minimal/lib
          llvm-minimal/bin/llvm-config --version

      - name: Run cargo test
        if: github.event.inputs.skip_tests != 'true'
        shell: bash
        run: |
          export LLVM_SYS_221_PREFIX="$PWD/llvm-minimal"
          cargo test --release --verbose

      - name: Build release
        shell: bash
        run: |
          export LLVM_SYS_221_PREFIX="$PWD/llvm-minimal"
          cargo build --release --verbose

      - name: Package artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail
          base="${{ needs.version.outputs.basename }}"
          rm -rf packaging
          mkdir -p packaging/linux

          # Linux 不打包 LLVM / lib：发行版包管理器可直接安装 LLVM，
          # 完整 LLVM 包会超过 GitHub Release 的 2GB 单文件限制。
          cp -a caylibs packaging/linux/
          [ -d third-party ] && cp -a third-party packaging/linux/ || true
          [ -d examples ] && cp -a examples packaging/linux/ || true

          for bin in cayc cay-ir ir2exe cay-check cay-run cay-rcpl cay-bcgen cay-lsp cavly cay-dt cay-dp cay-ast cay-pl cay-sir cay-pre; do
            if [ -f "target/release/$bin" ]; then
              cp "target/release/$bin" packaging/linux/
            fi
          done

          archive="${base}-linux-x86_64.tar.gz"
          tar -C packaging/linux -czf "$archive" .
          echo "ARCHIVE=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cavvy-nightly-linux
          path: ${{ steps.package.outputs.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Publish nightly pre-release
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete previous nightly release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release delete nightly-latest --yes 2>/dev/null || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly-latest" 2>/dev/null || true

      - name: Create nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-latest
          name: "Cavvy Nightly ${{ needs.version.outputs.tag }} build${{ needs.version.outputs.build }} (${{ needs.version.outputs.date }})"
          body: |
            **预发布版本** | Pre-release Build

            - 版本: `${{ needs.version.outputs.version }}`
            - 构建号: `${{ needs.version.outputs.build }}`（来自 `.verinfo`）
            - 日期: `${{ needs.version.outputs.date }}`
            - 提交: `${{ github.sha }}`

            ## 文件说明

            | 文件名 | 说明 |
            |--------|------|
            | `*-win-x86_64-mingw64-llvm22.zip` | Windows 完整版：含 lib、MinGW、LLVM 工具链 |
            | `*-win-x86_64-core.zip` | Windows 核心版：仅 exe + caylibs |
            | `*-linux-x86_64.tar.gz` | Linux 版：仅二进制 + caylibs（LLVM 由系统包管理器提供） |
          files: artifacts/*
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
