[package]
name = "cavvy"
# 请注意，自5.1.0-a.1开始，版本号已经改了
version = "5.3.0"
edition = "2024"

[dependencies]
thiserror = "2.0"
anyhow = "1.0"
logos = "0.15"
miette = { version = "7.5", features = ["fancy"] }
# LSP dependencies for cay-lsp
tower-lsp = "0.20"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.0"
env_logger = "0.11"
regex = "1.0"

# Cavly dependencies
toml = "0.8"
tempfile = "3.0"

# ESSO security dependencies (ESSO-10410 / ESSO-10430)
sha2 = "0.10"
ed25519-dalek = "2.1"
base64 = "0.22"
serde_jcs = "0.2"

# LLVM 嵌入式支持 (用于 --use-embedded-llc)
# llvm-sys 版本与 LLVM 版本对应关系: 221 = LLVM 22.1.x
llvm-sys = { version = "221" }
libc = "0.2"

# Windows平台构建所有bin（包括依赖MinGW的ir2exe）
[[bin]]
name = "cayc"
path = "src/bin/cayc.rs"

[[bin]]
name = "cay-ir"
path = "src/bin/cay-ir.rs"

[[bin]]
name = "ir2exe"
path = "src/bin/ir2exe.rs"

[[bin]]
name = "cay-check"
path = "src/bin/cay-check.rs"

[[bin]]
name = "cay-run"
path = "src/bin/cay-run.rs"

[[bin]]
name = "cay-rcpl"
path = "src/bin/cay-rcpl.rs"

[[bin]]
name = "cay-bcgen"
path = "src/bin/cay-bcgen.rs"

[[bin]]
name = "cay-lsp"
path = "src/bin/cay-lsp.rs"

[[bin]]
name = "cavly"
path = "src/bin/cavly.rs"

[[bin]]
name = "cay-dt"
path = "src/bin/cay-dt.rs"

[[bin]]
name = "cay-dp"
path = "src/bin/cay-dp.rs"

[[bin]]
name = "cay-setup"
path = "src/bin/cay-setup.rs"
test = false

[[bin]]
name = "cay-ast"
path = "src/bin/cay-ast.rs"

[[bin]]
name = "cay-pl"
path = "src/bin/cay-pl.rs"

[[bin]]
name = "cay-sir"
path = "src/bin/cay-sir.rs"

[features]
default = []
# 保留特性标志以向后兼容，但 llvm-sys 现在是默认依赖
embedded-llvm = []
